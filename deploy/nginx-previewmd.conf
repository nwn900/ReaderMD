# PreviewMD newsletter endpoint, spliced into the
# experiments.frontierslab.ai server block.
#
# Exact-match (`location =`) so it outranks every regex location in that vhost
# and never falls through to the static `try_files`.
#
# Requires this line in the http context (see conf.d/previewmd-ratelimit.conf):
#   limit_req_zone $binary_remote_addr zone=previewmd_signup:1m rate=6r/m;

location = /previewmd/api/subscribe {
    # A human signs up once. Anything faster is a bot filling the table.
    limit_req zone=previewmd_signup burst=3 nodelay;
    limit_req_status 429;

    # The backend only implements POST; reject the rest at the edge so its
    # bundled static handler is never exercised.
    if ($request_method != POST) {
        return 405;
    }

    client_max_body_size 4k;
    client_body_timeout 10s;

    proxy_pass http://127.0.0.1:8419/api/subscribe;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
}
