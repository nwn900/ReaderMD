# The three PreviewMD location blocks, spliced into the
# experiments.frontierslab.ai server block.
#
# Requires this line in the http context (see conf.d/previewmd-ratelimit.conf):
#   limit_req_zone $binary_remote_addr zone=previewmd_signup:1m rate=12r/m;

# --- Newsletter endpoint ----------------------------------------------------
# Exact-match (`location =`) so it outranks every regex location in that vhost
# and never falls through to the static `try_files`.
location = /previewmd/api/subscribe {
    # ~1 request per 5s per IP: tolerant of several people behind one NAT,
    # still far below what makes table-stuffing worthwhile.
    limit_req zone=previewmd_signup burst=5 nodelay;
    limit_req_status 429;

    # The backend only implements POST; reject the rest at the edge so its
    # bundled static handler is never exercised.
    if ($request_method != POST) {
        return 405;
    }

    client_max_body_size 4k;
    client_body_timeout 10s;

    proxy_pass http://127.0.0.1:8419/api/subscribe;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
}

# --- Download counter -------------------------------------------------------
location = /previewmd/api/download {
    # The counter is deliberately best-effort. Rate limiting bad clients here
    # never blocks the separately served ZIP archive.
    limit_req zone=previewmd_signup burst=5 nodelay;
    limit_req_status 429;

    if ($request_method != POST) {
        return 405;
    }

    client_max_body_size 4k;
    client_body_timeout 10s;

    proxy_pass http://127.0.0.1:8419/api/download;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
}

# --- Static page ------------------------------------------------------------
# PreviewMD ships no inline script and no inline style, so it can carry a strict
# CSP that the other (heterogeneous, wasm-and-jsx) experiments cannot.
#
# Deliberately a plain prefix, NOT `^~`: `^~` would outrank the vhost's deny
# regexes and re-expose server.py under this path. Plain prefix keeps regex
# precedence, so the deny rules and the asset `expires` still apply, and this
# block ends up serving exactly the thing CSP matters for — the HTML document.
#
# add_header REPLACES the server-level set rather than extending it, so all five
# server headers are repeated here. Keep them in sync with the vhost.
location /previewmd/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    expires -1;
    try_files $uri $uri/ =404;
}
