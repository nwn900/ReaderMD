name: ReaderMD port validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  scrub-and-build:
    if: github.event.pull_request.head.ref == 'agent/windows-port'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/windows-port
          fetch-depth: 0
          persist-credentials: true

      - name: Remove inherited visual assets
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force assets/screenshots -ErrorAction SilentlyContinue
          Remove-Item -Force assets/AppIcon.svg -ErrorAction SilentlyContinue
          Remove-Item -Force site/AppIcon.svg -ErrorAction SilentlyContinue
          Get-ChildItem site -Filter "*.dmg" -File -ErrorAction SilentlyContinue | Remove-Item -Force

      - name: Rename inherited identifiers and paths
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          root = Path.cwd()
          old = "Pre" + "viewMD"
          new = "ReaderMD"
          pairs = [
              (old, new),
              (old.lower(), new.lower()),
              (old.upper(), new.upper()),
          ]

          for path in [p for p in root.rglob("*") if p.is_file() and ".git" not in p.parts]:
              try:
                  data = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              changed = data
              for source, target in pairs:
                  changed = changed.replace(source, target)
              if changed != data:
                  path.write_text(changed, encoding="utf-8", newline="")

          paths = sorted(
              [p for p in root.rglob("*") if p != root and ".git" not in p.parts],
              key=lambda p: len(p.parts),
              reverse=True,
          )
          for path in paths:
              renamed = path.name
              for source, target in pairs:
                  renamed = renamed.replace(source, target)
              if renamed != path.name and path.exists():
                  path.rename(path.with_name(renamed))
          '@ | python -

      - name: Build Windows app
        shell: pwsh
        run: dotnet build Windows/ReaderMD.Windows/ReaderMD.Windows.csproj -c Release

      - name: Verify inherited branding is absent
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import sys

          root = Path.cwd()
          old = ("Pre" + "viewMD").casefold()
          hits = []
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if old in str(path).casefold():
                  hits.append(str(path))
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if old in text.casefold():
                  hits.append(str(path))
          if hits:
              print("Inherited branding remains:")
              print("\n".join(hits))
              sys.exit(1)
          '@ | python -

      - name: Commit validated tree
        shell: pwsh
        run: |
          git add -A
          if (git diff --cached --quiet) { exit 0 }
          git config user.name "ReaderMD Port Bot"
          git config user.email "actions@github.com"
          git commit -m "Finish ReaderMD branding scrub" -m "Signed-off-by: ReaderMD Port Bot <actions@github.com>"
          git push origin HEAD:agent/windows-port
