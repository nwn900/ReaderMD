name: Port and branding scrub

on:
  push:
    branches:
      - agent/windows-port

permissions:
  contents: write

jobs:
  scrub-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove inherited visual assets
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force assets/screenshots -ErrorAction SilentlyContinue
          Remove-Item -Force assets/AppIcon.svg -ErrorAction SilentlyContinue
          Remove-Item -Force site/AppIcon.svg -ErrorAction SilentlyContinue
          Get-ChildItem site -Filter "*.dmg" -File -ErrorAction SilentlyContinue | Remove-Item -Force

      - name: Rename inherited identifiers and paths
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import os

          root = Path.cwd()
          old = "Pre" + "viewMD"
          new = "ReaderMD"
          pairs = [(old, new), (old.lower(), new.lower())]

          skip = {root / ".git"}
          files = [p for p in root.rglob("*") if p.is_file() and not any(s in p.parents for s in skip)]
          for path in files:
              try:
                  data = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              changed = data
              for source, target in pairs:
                  changed = changed.replace(source, target)
              if changed != data:
                  path.write_text(changed, encoding="utf-8", newline="")

          paths = sorted(
              [p for p in root.rglob("*") if p != root and ".git" not in p.parts],
              key=lambda p: len(p.parts),
              reverse=True,
          )
          for path in paths:
              name = path.name
              renamed = name
              for source, target in pairs:
                  renamed = renamed.replace(source, target)
              if renamed != name and path.exists():
                  path.rename(path.with_name(renamed))
          '@ | python -

      - name: Build Windows app
        shell: pwsh
        run: dotnet build Windows/ReaderMD.Windows/ReaderMD.Windows.csproj -c Release

      - name: Verify inherited branding is absent
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import sys

          root = Path.cwd()
          old = "Pre" + "viewMD"
          needles = (old, old.lower())
          hits = []
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if any(needle in str(path) for needle in needles):
                  hits.append(str(path))
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if any(needle in text for needle in needles):
                  hits.append(str(path))
          if hits:
              print("Inherited branding remains:")
              print("\n".join(hits))
              sys.exit(1)
          '@ | python -

      - name: Commit scrubbed tree
        shell: pwsh
        run: |
          git rm --ignore-unmatch .github/workflows/port-and-scrub.yml
          git add -A
          if (git diff --cached --quiet) { exit 0 }
          git config user.name "ReaderMD Port Bot"
          git config user.email "actions@github.com"
          git commit -m "Complete ReaderMD Windows port and rebrand" -m "Signed-off-by: ReaderMD Port Bot <actions@github.com>"
          git push origin HEAD:agent/windows-port
